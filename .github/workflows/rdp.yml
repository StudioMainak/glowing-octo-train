name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create RDP User
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString "AdminPass2026!#" -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $Password -Description "Automated RDP User" -PasswordNeverExpires
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"

      - name: Install Tailscale
        shell: powershell
        run: |
          winget install --id Tailscale.Tailscale -e --silent --accept-source-agreements --accept-package-agreements
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

      - name: Establish Tailscale Connection
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $tailscalePath = "C:\Program Files\Tailscale\tailscale.exe"
          & $tailscalePath up --authkey=$env:TAILSCALE_AUTHKEY --unattended --hostname="azure-runner"
          Start-Sleep -Seconds 5

      - name: Maintain Connection & Output Info
        shell: powershell
        run: |
          $tailscalePath = "C:\Program Files\Tailscale\tailscale.exe"
          $ip = (&$tailscalePath ip -4).Trim()
          
          Write-Host "`n==========================================" -ForegroundColor Green
          Write-Host "RDP ADDRESS : $ip" -ForegroundColor Yellow
          Write-Host "USERNAME    : .\RDP" -ForegroundColor Yellow
          Write-Host "PASSWORD    : AdminPass2026!#" -ForegroundColor Yellow
          Write-Host "==========================================`n" -ForegroundColor Green

          # Keep runner alive for up to 6 hours
          for ($i = 0; $i -lt 350; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Runner active - Keepalive ping"
          }
